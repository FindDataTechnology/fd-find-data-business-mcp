[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-find-data-business-mcp"
dynamic = ["version"]
description = "Commercial, login-gated MCP server serving FindData's own crawled data — zero upstream-provider exposure."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    # [data]: fetch adapters — read_range cold-range fills dispatch through
    # them. [search]: sentence-transformers — ai_search's vector search.
    # The image sits on the fd-open-data-mcp:torch base, which already
    # provides the torch CPU build and the baked embedding model.
    # Floor: 0.5.21 is the first release whose schema gate resolves the
    # revision chain from an installed package (this image has no source
    # checkout); 0.5.20 and older resolve the alembic library's own directory
    # instead and fail every core tool at startup. Failing the build on a
    # stale version beats shipping that image.
    "fd-open-data-mcp[data,search]>=0.5.21",
    "fastmcp>=2.0",
    "click",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/FindDataTechnology/fd-find-data-business-mcp"
Repository = "https://github.com/FindDataTechnology/fd-find-data-business-mcp"
Issues = "https://github.com/FindDataTechnology/fd-find-data-business-mcp/issues"

[project.scripts]
fd-find-data-business-mcp = "fd_find_data_business_mcp.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "fd_find_data_business_mcp.__version__" }

[tool.setuptools.packages.find]
include = ["fd_find_data_business_mcp", "fd_find_data_business_mcp.*"]
