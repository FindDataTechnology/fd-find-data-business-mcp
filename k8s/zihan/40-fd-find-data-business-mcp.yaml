# fd-find-data-business-mcp — commercial FindData MCP server (login-gated).
#
# Deploy on zihan k3s, namespace fd-mcp. Shares the fd-mcp-env Secret with
# fd-open-data-mcp / fd-cn-report; add FDBIZ_JWKS_URI / FDBIZ_ISSUER /
# FDBIZ_AUDIENCE to that Secret before applying (see README.md "Deploy").
#
# NodePort 30803 continues the sequence: 30801=fd-open-data-mcp, 30802=fd-cn-report.
# Image pipeline (since 2026-09-19): Jenkins job fd-find-data-business-mcp
# builds from gitee main on push and pushes immutable sha-<short-hash> tags to
# Harbor project finddata-business. This manifest is managed by the ArgoCD
# application fd-find-data-business-mcp (tencent cluster → zihan via SSH relay)
# — bump the tag here to release.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-find-data-business-mcp
  namespace: fd-mcp
  labels:
    app.kubernetes.io/name: fd-find-data-business-mcp
    app.kubernetes.io/part-of: finddata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-find-data-business-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-find-data-business-mcp
        app.kubernetes.io/part-of: finddata
    spec:
      containers:
        - name: fd-find-data-business-mcp
          image: 100.64.0.8:30880/finddata-business/fd-find-data-business-mcp:sha-57e2a1c
          imagePullPolicy: Always
          ports:
            - name: mcp
              containerPort: 8310
          envFrom:
            - secretRef:
                name: fd-mcp-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1000m"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fd-find-data-business-mcp
  namespace: fd-mcp
  labels:
    app.kubernetes.io/name: fd-find-data-business-mcp
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-find-data-business-mcp
  ports:
    - name: mcp
      port: 8310
      targetPort: mcp
      nodePort: 30803
